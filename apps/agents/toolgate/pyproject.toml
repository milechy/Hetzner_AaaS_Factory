[project]
name = "toolgate"
version = "0.1.0"
description = "ToolGate Policy Engine (v1.0) - allow/deny tool execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.ruff]
line-length = 100
target-version = "py311"