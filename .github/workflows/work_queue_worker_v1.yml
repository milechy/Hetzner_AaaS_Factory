name: Work Queue Worker (Option A, v1 - start-only)

on:
  schedule:
    # まずは低頻度（例: 15分）。安定したら 5〜10分へ。
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [work-queue-worker]

concurrency:
  # 同一ワークフローの多重起動を禁止（単一ワーカ原則）
  group: work-queue-worker
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  start_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Ensure Python deps
        run: |
          python -m pip install --upgrade pip requests

      - name: Configure git identity (for SSOT commits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start head job if queued (SSOT mutation; fail-safe)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python - <<'PY'
          import json, os, subprocess, sys, time, secrets
          from datetime import datetime, timezone
          from pathlib import Path

          from tools.repo_lock import RepoLock, RepoLockError

          QUEUE_BRANCH = "__factory_state__/work_queue"
          QUEUE_PATH = "factory/work_queue.jsonl"

          def run(cmd):
            p = subprocess.run(cmd, text=True, capture_output=True)
            if p.returncode != 0:
              raise RuntimeError(f"cmd_failed cmd={' '.join(cmd)} rc={p.returncode} stderr={(p.stderr or '').strip()}")
            return p

          def now_iso():
            return datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          # Fetch + read SSOT without switching branches first
          run(["git", "fetch", "origin", QUEUE_BRANCH])
          raw = run(["git", "show", f"origin/{QUEUE_BRANCH}:{QUEUE_PATH}"]).stdout.splitlines()

          events = []
          for ln in raw:
            ln = ln.strip()
            if not ln:
              continue
            obj = json.loads(ln)
            if isinstance(obj, dict) and obj.get("type") != "__init__":
              events.append(obj)

          # Fold events
          order = []  # enqueue order
          state = {}  # jobId -> {"status": "...", "last": {...}}
          terminal = {"done", "fail", "cancel"}

          for ev in events:
            t = ev.get("type")
            jid = ev.get("jobId")
            if not jid:
              continue
            st = state.setdefault(jid, {"status": "unknown", "last": None})
            if t == "enqueue":
              if jid not in order:
                order.append(jid)
              st["status"] = "queued"
              st["last"] = ev
            elif t == "start":
              st["status"] = "running"
              st["last"] = ev
            elif t == "block":
              st["status"] = "blocked"
              st["last"] = ev
            elif t == "unblock":
              st["status"] = "running"
              st["last"] = ev
            elif t in terminal:
              st["status"] = t
              st["last"] = ev
            else:
              st["status"] = "unknown"
              st["last"] = ev

          # Determine head non-terminal
          head = None
          for jid in order:
            s = state.get(jid, {}).get("status")
            if s and s not in terminal:
              head = jid
              break

          if not head:
            print("[Worker] head=None (queue empty or all terminal). exit=0")
            sys.exit(0)

          head_status = state[head]["status"]
          print(f"[Worker] head_job_id={head} status={head_status}")

          if head_status == "blocked":
            print("[Worker] head is blocked. exit=2 (human gate)")
            sys.exit(2)

          if head_status not in {"queued", "running"}:
            print(f"[Worker] unexpected head status={head_status}. exit=4 (fail-safe)")
            sys.exit(4)

          # Start-only behavior: only mutate when head is queued
          if head_status == "running":
            print("[Worker] head already running. no mutation. exit=0")
            sys.exit(0)

          # Acquire queue lock and append start
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GITHUB_TOKEN", "")
          api_base = "https://api.github.com"
          sha = os.environ.get("GITHUB_SHA", "") or "0000000"

          lock = RepoLock(repo=repo, api_base=api_base, gh_token=token, namespace="work_queue")
          try:
            lock.acquire(sha)

            # Switch to SSOT branch and append
            run(["git", "checkout", "-B", QUEUE_BRANCH, f"origin/{QUEUE_BRANCH}"])

            path = Path(QUEUE_PATH)
            evt_id = f"evt_{int(time.time())}_{secrets.token_hex(2)}"
            start_ev = {
              "eventId": evt_id,
              "ts": now_iso(),
              "actor": "github-actions[bot]",
              "type": "start",
              "jobId": head,
            }
            with path.open("a", encoding="utf-8") as f:
              f.write(json.dumps(start_ev, ensure_ascii=False) + "\n")

            run(["git", "add", QUEUE_PATH])
            run([
              "git",
              "-c", "user.name=github-actions[bot]",
              "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
              "commit",
              "-m",
              "chore(queue): start head job (worker)",
            ])
            run(["git", "push", "origin", f"HEAD:{QUEUE_BRANCH}"])

            print(f"[Worker] appended start eventId={evt_id} jobId={head} -> {QUEUE_BRANCH}:{QUEUE_PATH}")
            sys.exit(0)

          except RepoLockError as e:
            print(f"[Worker] lock failure: {e}. exit=3")
            sys.exit(3)
          finally:
            try:
              lock.release()
            except Exception as e:
              print(f"[Worker] lock release warning: {e}", file=sys.stderr)
          PY
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "[Worker] exit=2 is human gate (blocked). Treat as success." >&2
            exit 0
          fi
          exit "$rc"