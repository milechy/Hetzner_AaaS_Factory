name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to cut (e.g. v1.3.7)"
        required: true
        type: string
      ref:
        description: "Git ref/branch to release from (default: main)"
        required: false
        default: "main"
        type: string

  # Optional safety net: allow tag-push releases too.
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create_release:
    # Prevent an infinite loop when this workflow (workflow_dispatch) creates & pushes a tag.
    # Tag-push runs triggered by github-actions[bot] are skipped.
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_dispatch: checkout inputs.ref (default main)
          # tag push: checkout the tag ref
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os, re, sys, pathlib

          tag = os.environ["TAG"]
          changelog = pathlib.Path("CHANGELOG.md")
          if not changelog.exists():
            print("CHANGELOG.md not found", file=sys.stderr)
            sys.exit(1)

          text = changelog.read_text(encoding="utf-8")

          # Find section header: ## [v1.3.0] - 2026-01-05
          pat = re.compile(rf"^##\s+\[{re.escape(tag)}\]\s+-\s+.+$", re.M)
          m = pat.search(text)
          if not m:
            print(f"Release section for {tag} not found in CHANGELOG.md", file=sys.stderr)
            print("Fix: add a section like '## [<tag>] - YYYY-MM-DD' to CHANGELOG.md on the release ref.", file=sys.stderr)
            sys.exit(1)

          # End at next "## [vX.Y.Z]" header or EOF
          m2 = re.search(r"^##\s+\[v\d+\.\d+\.\d+\]\s+-\s+.+$", text[m.end():], re.M)
          end = (m.end() + m2.start()) if m2 else len(text)

          body = text[m.start():end].strip()

          # Remove trailing separators if they exist (avoid "---\n\n---" duplication)
          body = re.sub(r"\n---\s*\Z", "", body).rstrip()

          # Append SSOT reference (fixed for v1.3 contract line)
          ssot = "master__open_pr_contract_v1_3.md"
          if "### SSOT" not in body:
            body += "\n\n---\n\n### SSOT\n- " + ssot + "\n"

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
            f.write("body<<EOF\n")
            f.write(body)
            f.write("\nEOF\n")
          PY

      - name: Create and push tag (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; will not recreate."
            exit 0
          fi

          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.tag }} – Open-PR Contract"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false